<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 336" role="img" aria-labelledby="gst gsd" style="width:100%;height:auto;max-width:720px;display:block;margin:0.8em auto" font-family="system-ui,-apple-system,'Hiragino Sans','Yu Gothic',Meiryo,sans-serif" font-size="13"><title id="gst">列が変われば分布も変わる ―― 妊娠期間はほとんどずれない</title><desc id="gsd">同じデータセットの妊娠期間146種のヒストグラム。平均164.4日と中央値165.5日はほとんど重なり、歪度は−0.06である。体重の歪度7.6とはまるで違う。平均を使ってよいかは、データセットごとではなく列ごとに決まる。</desc><text x="0.0" y="30.0" font-size="13.5" text-anchor="start" font-weight="bold" fill="currentColor" fill-opacity="1.0">妊娠期間146種 ―― 平均と中央値がほぼ重なる</text><rect x="58.5" y="222.7" width="22.6" height="29.3" fill="#00897b" fill-opacity="0.35" stroke="#00897b" stroke-width="1" stroke-opacity="0.6"/><rect x="82.1" y="244.7" width="22.6" height="7.3" fill="#00897b" fill-opacity="0.35" stroke="#00897b" stroke-width="1" stroke-opacity="0.6"/><rect x="129.2" y="244.7" width="22.6" height="7.3" fill="#00897b" fill-opacity="0.35" stroke="#00897b" stroke-width="1" stroke-opacity="0.6"/><rect x="152.8" y="244.7" width="22.6" height="7.3" fill="#00897b" fill-opacity="0.35" stroke="#00897b" stroke-width="1" stroke-opacity="0.6"/><rect x="176.3" y="244.7" width="22.6" height="7.3" fill="#00897b" fill-opacity="0.35" stroke="#00897b" stroke-width="1" stroke-opacity="0.6"/><rect x="199.9" y="222.7" width="22.6" height="29.3" fill="#00897b" fill-opacity="0.35" stroke="#00897b" stroke-width="1" stroke-opacity="0.6"/><rect x="223.5" y="134.7" width="22.6" height="117.3" fill="#00897b" fill-opacity="0.35" stroke="#00897b" stroke-width="1" stroke-opacity="0.6"/><rect x="247.0" y="127.3" width="22.6" height="124.7" fill="#00897b" fill-opacity="0.35" stroke="#00897b" stroke-width="1" stroke-opacity="0.6"/><rect x="270.6" y="193.3" width="22.6" height="58.7" fill="#00897b" fill-opacity="0.35" stroke="#00897b" stroke-width="1" stroke-opacity="0.6"/><rect x="294.2" y="164.0" width="22.6" height="88.0" fill="#00897b" fill-opacity="0.35" stroke="