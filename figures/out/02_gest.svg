11" text-anchor="middle" fill="currentColor" fill-opacity="0.7">200</text><text x="537.5" y="270.0" font-size="11" text-anchor="middle" fill="currentColor" fill-opacity="0.7">250</text><text x="608.0" y="270.0" font-size="11" text-anchor="start" fill="currentColor" fill-opacity="0.75">妊娠期間 (日)</text><line x1="324.3" y1="46.0" x2="324.3" y2="252.0" stroke="#00897b" stroke-width="1.8" stroke-opacity="0.9" stroke-dasharray="4 3"/><line x1="321.6" y1="46.0" x2="321.6" y2="252.0" stroke="#c62828" stroke-width="1.8" stroke-opacity="0.9" stroke-dasharray="4 3"/><text x="313.6" y="42.0" font-size="11.5" text-anchor="end" font-weight="bold" fill="#c62828" fill-opacity="1.0">平均 164.4日</text><text x="332.3" y="42.0" font-size="11.5" text-anchor="start" font-weight="bold" fill="#00897b" fill-opacity="1.0">中央値 165.5日</text><text x="612.0" y="120.0" font-size="12.5" text-anchor="start" font-weight="bold" fill="currentColor" fill-opacity="1.0">歪度 −0.06</text><text x="612.0" y="140.0" font-size="11.5" text-anchor="start" fill="currentColor" fill-opacity="0.85">ほぼ左右対称</text><text x="612.0" y="170.0" font-size="12" text-anchor="start" fill="#ef6c00" fill-opacity="1.0">体重は 7.6</text><text x="612.0" y="188.0" font-size="11.5" text-anchor="start" fill="#ef6c00" fill-opacity="0.9">（右に長い裾）</text><text x="0.0" y="296.0" font-size="11.5" text-anchor="start" fill="currentColor" fill-opacity="0.9">平均と中央値の差は 1.1日。体重では平均が中央値の約2倍だったのに、同じデータセットの別の列ではほとんど一致する。</text><text x="0.0" y="318.0" font-size="11.5" text-anchor="start" fill="currentColor" fill-opacity="0.9">「このデータは平均を使ってよいか」は、列ごとに判断することになる。だからまずヒストグラムを見る。</text><text x="0.0" y="334.0" font-size="11" text-anchor="start" fill="currentColor" fill-opacity="0.7"></text></svg>