x="564.1" y="316.8" width="30.6" height="3.2" fill="#5c6bc0" fill-opacity="0.35" stroke="#5c6bc0" stroke-width="1" stroke-opacity="0.6"/><rect x="595.7" y="315.2" width="30.6" height="4.8" fill="#5c6bc0" fill-opacity="0.35" stroke="#5c6bc0" stroke-width="1" stroke-opacity="0.6"/><rect x="658.9" y="316.8" width="30.6" height="3.2" fill="#5c6bc0" fill-opacity="0.35" stroke="#5c6bc0" stroke-width="1" stroke-opacity="0.6"/><line x1="58.0" y1="320.0" x2="690.0" y2="320.0" stroke="currentColor" stroke-width="1" stroke-opacity="0.45"/><text x="144.8" y="337.0" font-size="10.5" text-anchor="middle" fill="currentColor" fill-opacity="0.7">100</text><text x="316.6" y="337.0" font-size="10.5" text-anchor="middle" fill="currentColor" fill-opacity="0.7">1,000</text><text x="488.3" y="337.0" font-size="10.5" text-anchor="middle" fill="currentColor" fill-opacity="0.7">10,000</text><text x="660.1" y="337.0" font-size="10.5" text-anchor="middle" fill="currentColor" fill-opacity="0.7">100,000</text><text x="690.0" y="354.0" font-size="11" text-anchor="end" fill="currentColor" fill-opacity="0.75">体重 (g)　対数の目盛り（20区分）</text><text x="437.2" y="206.0" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#ef6c00" fill-opacity="1.0">5,039〜7,696g に 55種</text><line x1="398.7" y1="222.0" x2="398.7" y2="320.0" stroke="#00897b" stroke-width="1.8" stroke-opacity="0.9" stroke-dasharray="4 3"/><line x1="448.7" y1="222.0" x2="448.7" y2="320.0" stroke="#c62828" stroke-width="1.8" stroke-opacity="0.9" stroke-dasharray="4 3"/><text x="392.7" y="218.0" font-size="11.5" text-anchor="end" font-weight="bold" fill="#00897b" fill-opacity="1.0">中央値 3,006g</text><text x="454.7" y="218.0" font-size="11.5" text-anchor="start" font-weight="bold" fill="#c62828" fill-opacity="1.0">平均 5,881g</text><text x="0.0" y="374.0" font-size="11.5" text-anchor="start" fill="currentColor" fill-opacity="0.9">そのままの目盛りでは、265種のほとんどが左端の1本に潰れて分布の形が見えない。対数にすると、まとまりが2つあることが分かる。</text><text x="0.0" y="396.0" font-size="11" text-anchor="start" fill="currentColor" fill-opacity="0.7">（区分の切り方は本文の表と同じ。最小 31g から最大 149,325g までを対数で20等分している。）</text></svg>