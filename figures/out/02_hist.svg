<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 404" role="img" aria-labelledby="hst hsd" style="width:100%;height:auto;max-width:720px;display:block;margin:0.8em auto" font-family="system-ui,-apple-system,'Hiragino Sans','Yu Gothic',Meiryo,sans-serif" font-size="13"><title id="hst">体重265種の分布 ―― 平均と中央値がずれる理由</title><desc id="hsd">上は体重をそのままの目盛りで20区分したヒストグラム。ほとんどの種が左端の最初の区分に入り、右へ長い裾を引く。平均5,881gは中央値3,006gの約2倍で、少数の大型種に引き上げられている。下は同じデータを対数の目盛りで20区分したもので、小型のまとまりと5,039〜7,696gの55種のまとまりが見える。中央値は谷ではなく、平均は最多の区分に入っている。</desc><text x="0.0" y="28.0" font-size="13.5" text-anchor="start" font-weight="bold" fill="currentColor" fill-opacity="1.0">同じ265種を、目盛りを変えて2回描く</text><rect x="58.5" y="64.0" width="30.6" height="96.0" fill="#5c6bc0" fill-opacity="0.35" stroke="#5c6bc0" stroke-width="1" stroke-opacity="0.6"/><rect x="90.1" y="141.3" width="30.6" height="18.7" fill="#5c6bc0" fill-opacity="0.35" stroke="#5c6bc0" stroke-width="1" stroke-opacity="0.6"/><rect x="121.7" y="157.3" width="30.6" height="2.7" fill="#5c6bc0" fill-opacity="0.35" stroke="#5c6bc0" stroke-width="1" stroke-opacity="0.6"/><rect x="184.9" y="159.5" width="30.6" height="0.5" fill="#5c6bc0" fill-opacity="0.35" stroke="#5c6bc0" stroke-width="1" stroke-opacity="0.6"/><rect x="216.5" y="159.5" width="30.6" height="0.5" fill="#5c6bc0" fill-opacity="0.35" stroke="#5c6bc0" stroke-width="1" stroke-opacity="0.6"/><rect x="248.1" y="159.5" width="30.6" height="0.5" fill="#5c6bc0" fill-opacity="0.35" stroke="#5c6bc0" stroke-width="1" stroke-opacity="0.6"/><rect x="279.7" y="159.1" width="30.6" height="0.9" fill="#5c6bc0" fill-opacity="0.35" stroke="#5c6bc0" stroke-width="1" stroke-opacity="0.6"/><rect x="532.5" y="159.5" width="30.6" height="0.5" fill="#5c6bc0" fill-opacity="0.35" stroke="#5c6bc0" stroke-width="1" stroke-opacity="0.6"/><rect x="658.9" y="159.5" width="30.6" height="0.5" fill="#5c6bc0" fill-opacity="0.35" stroke="#5c6bc0" stroke-width="1" stroke-opacity="0.6"/><line x1="58.0" y1="160.0" x2="690.0" y2="