<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 372" role="img" aria-labelledby="mpt mpd" style="width:100%;height:auto;max-width:720px;display:block;margin:0.8em auto" font-family="system-ui,-apple-system,'Hiragino Sans','Yu Gothic',Meiryo,sans-serif" font-size="13"><title id="mpt">統計学Ⅰの地図 ―― 記述統計から推測統計へ</title><desc id="mpd">左の箱が記述統計（第2回 代表値、第3回 ばらつき、第5回 相関と因果）で、手元のデータを要約する。右の箱が推測統計（第6回 標本と中心極限定理、第7回 推定と信頼区間、第8・9回 仮説検定、第10〜13回 モデル）で、一部から全体を推し量る。この左右の境を越えるのが第6回である。下の帯が Python（Colab）で、第4回から最後まで全体を通して使う。第14回で両方を使って自分で判断する。おおまかな地図であり厳密な分類ではない。</desc><text x="0.0" y="28.0" font-size="13.5" text-anchor="start" font-weight="bold" fill="currentColor" fill-opacity="1.0">いま自分がどこにいるかを、毎回ここで確かめる</text><rect x="0.0" y="50.0" width="310.0" height="152.0" rx="6" ry="6" fill="#5c6bc0" fill-opacity="0.08" stroke="#5c6bc0" stroke-width="1" stroke-opacity="0.6"/><text x="14.0" y="76.0" font-size="14" text-anchor="start" font-weight="bold" fill="#5c6bc0" fill-opacity="1.0">記述統計</text><text x="14.0" y="95.0" font-size="11.5" text-anchor="start" fill="currentColor" fill-opacity="0.8">手元のデータを「要約」する</text><circle cx="20.0" cy="118.0" r="2.6" fill="#5c6bc0" fill-opacity="0.8"/><text x="32.0" y="122.0" font-size="12.5" text-anchor="start" fill="currentColor" fill-opacity="1.0">第02回　代表値（平均・中央値・最頻値）</text><circle cx="20.0" cy="143.0" r="2.6" fill="#5c6bc0" fill-opacity="0.8"/><text x="32.0" y="147.0" font-size="12.5" text-anchor="start" fill="currentColor" fill-opacity="1.0">第03回　ばらつき（分散・標準偏差）</text><circle cx="20.0" cy="168.0" r="2.6" fill="#5c6bc0" fill-opacity="0.8"/><text x="32.0" y="172.0" font-size="12.5" text-anchor="start" fill="currentColor" fill-opacity="1.0">第05回　相関（と、因果ではないこと）</text><rect x="410.0" y="50.0" width="310.0" height="178.0" rx="6" ry="6" fill="#00897b" fill-opacity="0.08" stroke="#00897b" stroke-width="1" stroke-opacity="0.6"/><text x="424.0" y="76.0" font-size="14" text-anchor="start" font-weight="bold" fill="#00897b" fill-opacity="1.0">推測統計</text><text x="424.0" y="95.0" font-size="11.5" text-anchor="start" fill="currentColor" fill-opacity="0.8">一部から「全体」を推し量る</text><circle cx="430.0" cy="118.0" r="2.6" fill="#00897b" fill-opacity="0.8"/><text x="442.0" y="122.0" font-size="12.5" text-anchor="start" fill="currentColor" fill-opacity="1.0">第06回　標本と母集団／中心極限定理</text><circle cx="430.0" cy="143.0" r="2.6" fill="#00897b" fill-opacity="0.8"/><text x="442.0" y="147.0" font-size="12.5" text-anchor="start" fill="currentColor" fill-opacity="1.0">第07回　推定（信頼区間）</text><circle cx="430.0" cy="168.0" r="2.6" fill="#00897b" fill-opacity="0.8"/><text x="442.0" y="172.0" font-size="12.5" text-anchor="start" fill="currentColor" fill-opacity="1.0">第08・09回　仮説検定（t検定・分散分析）</text><circle cx="430.0" cy="193.0" r="2.6" fill="#00897b" fill-opacity="0.8"/><text x="442.0" y="197.0" font-size="12.5" text-anchor="start" fill="currentColor" fill-opacity="1.0">第10〜13回　モデル（回帰・AIC・ベイズ・PCA）</text><text x="360.0" y="118.0" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#c62828" fill-opacity="1.0">ここを越えるのが</text><text x="360.0" y="134.0" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#c62828" fill-opacity="1.0">第06回</text><line x1="318.0" y1="152.0" x2="402.0" y2="152.0" stroke="#c62828" stroke-width="2" stroke-opacity="0.85"/><polygon points="402.0,152.0 393.8,155.7 393.8,148.3" fill="#c62828" fill-opacity="0.85"/><line x1="80.0" y1="202.0" x2="80.0" y2="252.0" stroke="currentColor" stroke-width="1" stroke-opacity="0.3"/><line x1="490.0" y1="228.0" x2="490.0" y2="252.0" stroke="currentColor" stroke-width="1" stroke-opacity="0.3"/><rect x="0.0" y="252.0" width="720.0" height="46.0" rx="6" ry="6" fill="#ef6c00" fill-opacity="0.1" stroke="#ef6c00" stroke-width="1" stroke-opacity="0.6"/><text x="16.0" y="280.0" font-size="12.5" text-anchor="start" font-weight="bold" fill="#ef6c00" fill-opacity="1.0">Python（Colab）―― 第04回で始動し、ここから最後まで全部これで動かす</text><line x1="360.0" y1="298.0" x2="360.0" y2="316.0" stroke="currentColor" stroke-width="1" stroke-opacity="0.3"/><rect x="180.0" y="316.0" width="360.0" height="38.0" rx="6" ry="6" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1" stroke-opacity="0.35"/><text x="360.0" y="341.0" font-size="12.5" text-anchor="middle" font-weight="bold" fill="currentColor" fill-opacity="1.0">第14回　総括 ―― 両方を使って、自分で決める</text><text x="0.0" y="368.0" font-size="11" text-anchor="start" fill="currentColor" fill-opacity="0.7">（この授業を進めるためのおおまかな地図。回帰や多変量解析のように、記述・探索・推測のどの目的にも使われる方法がある。）</text></svg>