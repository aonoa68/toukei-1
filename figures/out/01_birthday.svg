<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 348" role="img" aria-labelledby="bdt bdd" style="width:100%;height:auto;max-width:720px;display:block;margin:0.8em auto" font-family="system-ui,-apple-system,'Hiragino Sans','Yu Gothic',Meiryo,sans-serif" font-size="13"><title id="bdt">誕生日のパラドックス ―― 「誰かと誰か」と「自分と」はまるで違う</title><desc id="bdd">横軸は人数、縦軸は確率。誰かと誰かの誕生日が一致する確率は23人で0.507、41人で0.903に達する。一方、自分と同じ誕生日の人がいる確率は23人でも0.059しかない。直感がこちらの低い曲線を思い浮かべるため、確率を小さく見積もる。</desc><line x1="58.0" y1="262.0" x2="574.0" y2="262.0" stroke="currentColor" stroke-width="1" stroke-opacity="0.5"/><text x="50.0" y="266.0" font-size="11" text-anchor="end" fill="currentColor" fill-opacity="0.75">0%</text><line x1="58.0" y1="210.5" x2="574.0" y2="210.5" stroke="currentColor" stroke-width="1" stroke-opacity="0.14"/><text x="50.0" y="214.5" font-size="11" text-anchor="end" fill="currentColor" fill-opacity="0.75">25%</text><line x1="58.0" y1="159.0" x2="574.0" y2="159.0" stroke="currentColor" stroke-width="1" stroke-opacity="0.14"/><text x="50.0" y="163.0" font-size="11" text-anchor="end" fill="currentColor" fill-opacity="0.75">50%</text><line x1="58.0" y1="107.5" x2="574.0" y2="107.5" stroke="currentColor" stroke-width="1" stroke-opacity="0.14"/><text x="50.0" y="111.5" font-size="11" text-anchor="end" fill="currentColor" fill-opacity="0.75">75%</text><line x1="58.0" y1="56.0" x2="574.0" y2="56.0" stroke="currentColor" stroke-width="1" stroke-opacity="0.14"/><text x="50.0" y="60.0" font-size="11" text-anchor="end" fill="currentColor" fill-opacity="0.75">100%</text><line x1="58.0" y1="56.0" x2="58.0" y2="262.0" stroke="currentColor" stroke-width="1" stroke-opacity="0.1"/><text x="58.0" y="280.0" font-size="11" text-anchor="middle" fill="currentColor" fill-opacity="0.75">0</text><line x1="144.0" y1="56.0" x2="144.0" y2="262.0" stroke="currentColor" stroke-width="1" stroke-opacity="0.1"/><text x="144.0" y="280.0" font-size="11" text-anchor="middle" fill="currentColor" fill-opacity="0.75">10</t