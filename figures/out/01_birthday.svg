opacity="1.0">誰かと誰かが</text><text x="626.0" y="111.0" font-size="11.5" text-anchor="start" fill="currentColor" fill-opacity="1.0">同じ（本当の問い）</text><line x1="590.0" y1="136.0" x2="620.0" y2="136.0" stroke="#ef6c00" stroke-width="2.0" stroke-opacity="1.0" stroke-dasharray="5 3"/><text x="626.0" y="140.0" font-size="11.5" text-anchor="start" fill="currentColor" fill-opacity="1.0">自分と同じ人が</text><text x="626.0" y="155.0" font-size="11.5" text-anchor="start" fill="currentColor" fill-opacity="1.0">いる（直感の問い）</text><text x="0.0" y="300.0" font-size="11.5" text-anchor="start" fill="currentColor" fill-opacity="0.9">23人のペアは 253 通りある。比べる組の数が人数のほぼ2乗で増えるので、「誰かと誰か」は一気に上がる。</text><text x="0.0" y="326.0" font-size="11" text-anchor="start" fill="currentColor" fill-opacity="0.7">（うるう日を除く365日が等確率・各人独立という仮定のもとでの理論値。実データの集計ではない。）</text></svg>