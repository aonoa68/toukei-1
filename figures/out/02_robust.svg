<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 348" role="img" aria-labelledby="rbt rbd" style="width:100%;height:auto;max-width:720px;display:block;margin:0.8em auto" font-family="system-ui,-apple-system,'Hiragino Sans','Yu Gothic',Meiryo,sans-serif" font-size="13"><title id="rbt">極端な値を動かすと、平均だけが大きく動く</title><desc id="rbd">5個の数字 1, 2, 3, 4, 100 で、平均は22、中央値は3。100を1000に変えると平均は202に跳ね上がるが、中央値は3のまま動かない。100を削除すると個数が4個になり、中央値は2.5に変わる。実データでも同じで、ヒト科7種を除くと平均は1,754g動くのに中央値は209gしか動かない。</desc><text x="0.0" y="28.0" font-size="13.5" text-anchor="start" font-weight="bold" fill="currentColor" fill-opacity="1.0">中央値は「動かない」のではなく「動きにくい」</text><text x="136.0" y="82.0" font-size="11.5" text-anchor="end" fill="currentColor" fill-opacity="0.95">1, 2, 3, 4, 100</text><line x1="150.0" y1="78.0" x2="560.0" y2="78.0" stroke="currentColor" stroke-width="1" stroke-opacity="0.3"/><circle cx="150.0" cy="78.0" r="4.2" fill="#5c6bc0" fill-opacity="0.6"/><circle cx="191.1" cy="78.0" r="4.2" fill="#5c6bc0" fill-opacity="0.6"/><circle cx="215.2" cy="78.0" r="4.2" fill="#5c6bc0" fill-opacity="0.6"/><circle cx="232.3" cy="78.0" r="4.2" fill="#5c6bc0" fill-opacity="0.6"/><circle cx="423.3" cy="78.0" r="4.2" fill="#5c6bc0" fill-opacity="0.6"/><circle cx="215.2" cy="78.0" r="5.4" fill="#00897b" fill-opacity="1.0"/><circle cx="333.5" cy="78.0" r="5.4" fill="#c62828" fill-opacity="1.0"/><text x="215.2" y="100.0" font-size="11" text-anchor="middle" font-weight="bold" fill="#00897b" fill-opacity="1.0">中央値 3</text><text x="333.5" y="64.0" font-size="11" text-anchor="middle" font-weight="bold" fill="#c62828" fill-opacity="1.0">平均 22</text><text x="136.0" y="144.0" font-size="11.5" text-anchor="end" fill="currentColor" fill-opacity="0.95">100 を 1000 に変える</text><line x1="150.0" y1="140.0" x2="560.0" y2="140.0" stroke="currentColor" stroke-width="1" stroke-opacity="0.3"/><circle cx="150.0" cy="140.0" r="4.2" fill="#5c6bc0" fill-opacity="0.6"/><circle cx="191.1" cy="140.0" r="4.2" fill="#5c6bc0" fill-opacity="0.6"/><circle cx="215.2" cy="140.0" r="4.2" fill="#5c6bc0" fill-opacity="0.6"/><circle cx="232.3" cy="140.0" r="4.2" fill="#5c6bc0" fill-opacity="0.6"/><circle cx="560.0" cy="140.0" r="4.2" fill="#5c6bc0" fill-opacity="0.6"/><circle cx="215.2" cy="140.0" r="5.4" fill="#00897b" fill-opacity="1.0"/><circle cx="465.1" cy="140.0" r="5.4" fill="#c62828" fill-opacity="1.0"/><text x="215.2" y="162.0" font-size="11" text-anchor="middle" font-weight="bold" fill="#00897b" fill-opacity="1.0">中央値 3</text><text x="465.1" y="126.0" font-size="11" text-anchor="middle" font-weight="bold" fill="#c62828" fill-opacity="1.0">平均 202</text><text x="136.0" y="206.0" font-size="11.5" text-anchor="end" fill="currentColor" fill-opacity="0.95">100 を 削除する</text><line x1="150.0" y1="202.0" x2="560.0" y2="202.0" stroke="currentColor" stroke-width="1" stroke-opacity="0.3"/><circle cx="150.0" cy="202.0" r="4.2" fill="#5c6bc0" fill-opacity="0.6"/><circle cx="191.1" cy="202.0" r="4.2" fill="#5c6bc0" fill-opacity="0.6"/><circle cx="215.2" cy="202.0" r="4.2" fill="#5c6bc0" fill-opacity="0.6"/><circle cx="232.3" cy="202.0" r="4.2" fill="#5c6bc0" fill-opacity="0.6"/><circle cx="204.4" cy="202.0" r="5.4" fill="#00897b" fill-opacity="1.0"/><circle cx="204.4" cy="202.0" r="5.4" fill="#c62828" fill-opacity="1.0"/><text x="204.4" y="224.0" font-size="11" text-anchor="middle" font-weight="bold" fill="#00897b" fill-opacity="1.0">中央値 2.5</text><text x="204.4" y="188.0" font-size="11" text-anchor="middle" font-weight="bold" fill="#c62828" fill-opacity="1.0">平均 2.5</text><text x="150.0" y="262.0" font-size="10.5" text-anchor="middle" fill="currentColor" fill-opacity="0.6">1</text><text x="286.7" y="262.0" font-size="10.5" text-anchor="middle" fill="currentColor" fill-opacity="0.6">10</text><text x="423.3" y="262.0" font-size="10.5" text-anchor="middle" fill="currentColor" fill-opacity="0.6">100</text><text x="560.0" y="262.0" font-size="10.5" text-anchor="middle" fill="currentColor" fill-opacity="0.6">1000</text><text x="560.0" y="280.0" font-size="11" text-anchor="end" fill="currentColor" fill-opacity="0.7">値（対数の目盛り）</text><text x="0.0" y="308.0" font-size="11.5" text-anchor="start" fill="currentColor" fill-opacity="0.9">実データでも同じ。ヒト科7種（全体の2.6%）を除くと、平均は 1,754g 動くのに、中央値は 209g しか動かない（比 8.4倍）。</text><text x="0.0" y="330.0" font-size="11.5" text-anchor="start" fill="currentColor" fill-opacity="0.9">順位だけを見る中央値は、端の値の大きさに引っ張られない。ただし観測を足し引きすると真ん中の位置がずれるので、変わることはある。</text><text x="0.0" y="346.0" font-size="11" text-anchor="start" fill="currentColor" fill-opacity="0.7"></text></svg>