<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 366" role="img" aria-labelledby="lst lsd" style="width:100%;height:auto;max-width:720px;display:block;margin:0.8em auto" font-family="system-ui,-apple-system,'Hiragino Sans','Yu Gothic',Meiryo,sans-serif" font-size="13"><title id="lst">「下手さ」の測り方を変えると、答えが平均か中央値に変わる</title><desc id="lsd">データ 1, 2, 6 について、代表の候補 c をいろいろ動かしたときの「ズレの合計」を描いた。二乗で測った赤い曲線はなめらかな放物線で、最小になるのは c = 3、すなわち平均である。絶対値で測った青い折れ線は角のある形で、最小になるのは c = 2、すなわち中央値（データの点）である。同じデータでも、下手さの測り方を変えると答えが変わる。</desc><text x="0.0" y="30.0" font-size="13.5" text-anchor="start" font-weight="bold" fill="currentColor" fill-opacity="1.0">同じデータなのに、最小になる場所が違う</text><line x1="58.0" y1="262.0" x2="560.0" y2="262.0" stroke="currentColor" stroke-width="1" stroke-opacity="0.45"/><line x1="58.0" y1="72.0" x2="58.0" y2="262.0" stroke="currentColor" stroke-width="1" stroke-opacity="0.08"/><text x="58.0" y="280.0" font-size="11" text-anchor="middle" fill="currentColor" fill-opacity="0.75">0</text><line x1="129.7" y1="72.0" x2="129.7" y2="262.0" stroke="currentColor" stroke-width="1" stroke-opacity="0.08"/><text x="129.7" y="280.0" font-size="11" text-anchor="middle" fill="currentColor" fill-opacity="0.75">1</text><line x1="201.4" y1="72.0" x2="201.4" y2="262.0" stroke="currentColor" stroke-width="1" stroke-opacity="0.08"/><text x="201.4" y="280.0" font-size="11" text-anchor="middle" fill="currentColor" fill-opacity="0.75">2</text><line x1="273.1" y1="72.0" x2="273.1" y2="262.0" stroke="currentColor" stroke-width="1" stroke-opacity="0.08"/><text x="273.1" y="280.0" font-size="11" text-anchor="middle" fill="currentColor" fill-opacity="0.75">3</text><line x1="344.9" y1="72.0" x2="344.9" y2="262.0" stroke="currentColor" stroke-width="1" stroke-opacity="0.08"/><text x="344.9" y="280.0" font-size="11" text-anchor="middle" fill="currentColor" fill-opacity="0.75">4</text><line x1="416.6" y1="72.0" x2="416.6" y2="262.0" stroke="currentColor" stroke-width="1" stroke-opacity="0.08"/><text x=