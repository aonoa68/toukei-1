<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 352" role="img" aria-labelledby="mht mhd" style="width:100%;height:auto;max-width:720px;display:block;margin:0.8em auto" font-family="system-ui,-apple-system,'Hiragino Sans','Yu Gothic',Meiryo,sans-serif" font-size="13"><title id="mht">モンティ・ホール ―― 最初の1枚で結果は決まっている</title><desc id="mhd">縦の幅が確率を表す。最初に当たりを引く確率は3分の1で、このときだけ「変えない」が当たり、「変える」はハズレになる。最初にハズレを引く確率は3分の2で、このときは「変えない」がハズレ、「変える」が必ず当たる。したがって変えないときに当たる確率は3分の1、変えるときは3分の2である。</desc><text x="0.0" y="30.0" font-size="13.5" text-anchor="start" font-weight="bold" fill="currentColor" fill-opacity="1.0">最初の1枚を選んだ時点で、結果は決まっている</text><text x="300.0" y="62.0" font-size="13" text-anchor="middle" font-weight="bold" fill="currentColor" fill-opacity="1.0">変えない</text><text x="564.0" y="62.0" font-size="13" text-anchor="middle" font-weight="bold" fill="currentColor" fill-opacity="1.0">変える</text><text x="166.0" y="101.0" font-size="12" text-anchor="end" font-weight="bold" fill="currentColor" fill-opacity="1.0">最初が当たり</text><text x="166.0" y="118.0" font-size="12" text-anchor="end" fill="currentColor" fill-opacity="0.75">確率 1/3</text><text x="166.0" y="200.0" font-size="12" text-anchor="end" font-weight="bold" fill="currentColor" fill-opacity="1.0">最初がハズレ</text><text x="166.0" y="217.0" font-size="12" text-anchor="end" fill="currentColor" fill-opacity="0.75">確率 2/3</text><rect x="176.0" y="74.0" width="248.0" height="66.0" rx="4" ry="4" fill="#00897b" fill-opacity="0.14" stroke="#00897b" stroke-width="1" stroke-opacity="0.65"/><text x="300.0" y="113.0" font-size="13.5" text-anchor="middle" font-weight="bold" fill="#00897b" fill-opacity="1.0">○ 当たり</text><rect x="440.0" y="74.0" width="248.0" height="66.0" rx="4" ry="4" fill="#c62828" fill-opacity="0.14" stroke="#c62828" stroke-width="1" stroke-opacity="0.65"/><text x="564.0" y="113.0" font-size="13.5" text-anchor="middle" font-weight="bold" fill="#c62828" fill-opacity="1.0">× ハズレ</text><rect x="176.0" y="140.0" width="248.0" height="132.0" rx="4" ry="4" fill="#c62828" fill-opacity="0.14" stroke="#c62828" stroke-width="1" stroke-opacity="0.65"/><text x="300.0" y="212.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#c62828" fill-opacity="1.0">× ハズレ</text><rect x="440.0" y="140.0" width="248.0" height="132.0" rx="4" ry="4" fill="#00897b" fill-opacity="0.14" stroke="#00897b" stroke-width="1" stroke-opacity="0.65"/><text x="564.0" y="212.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#00897b" fill-opacity="1.0">○ 当たり</text><line x1="0.0" y1="288.0" x2="720.0" y2="288.0" stroke="currentColor" stroke-width="1" stroke-opacity="0.25"/><text x="300.0" y="312.0" font-size="13.5" text-anchor="middle" font-weight="bold" fill="#c62828" fill-opacity="1.0">当たる確率 1/3 ＝ 約33%</text><text x="564.0" y="312.0" font-size="13.5" text-anchor="middle" font-weight="bold" fill="#00897b" fill-opacity="1.0">当たる確率 2/3 ＝ 約67%</text><text x="0.0" y="344.0" font-size="11.5" text-anchor="start" fill="currentColor" fill-opacity="0.85">縦の幅が確率。「変える」が勝つのは、最初にハズレを引いていた場合（確率2/3）であり、そのときは必ず当たる。</text></svg>